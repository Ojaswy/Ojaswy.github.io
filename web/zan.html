<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斬 ZAN · The Heaven-Cutting Engine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070407'/%3E%3Cpath d='M4 27L27 4' stroke='%23ff3b30' stroke-width='3.2' stroke-linecap='square'/%3E%3Cpath d='M4 27L27 4' stroke='%23fff0ea' stroke-width='1' stroke-linecap='square'/%3E%3Cpath d='M6 6h6M20 26h6' stroke='%23d31a2b' stroke-width='2'/%3E%3C/svg%3E">
<meta name="description" content="A perpetual mechanism in five acts. The cursor is a blade and the rendered frame itself can be cut.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@300;400&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070407;
    --blood:#d31a2b;
    --ember:#ff3b30;
    --darkred:#5c0e16;
    --bone:#f0e8dc;
    --ash:#6b5f63;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;overscroll-behavior:none;
    background:var(--ink);color:var(--bone);
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(211,26,43,.4)}
  canvas#scene{position:fixed;inset:0;display:block;cursor:crosshair}
  canvas#blade{position:fixed;inset:0;pointer-events:none;z-index:45}

  /* ---------- environmental mega-typography ---------- */
  #megakanji{
    position:fixed;inset:0;z-index:5;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #megakanji span{
    position:absolute;
    font-family:'Noto Serif JP',serif;font-weight:900;
    font-size:46vh;line-height:1;
    color:var(--blood);opacity:0;
    transform:scale(1.15);
    transition:opacity 1.4s ease,transform 1.4s ease;
  }
  #megakanji span.on{opacity:.07;transform:scale(1)}

  /* ---------- act titles ---------- */
  #acts{position:fixed;left:40px;bottom:96px;z-index:40;pointer-events:none}
  .act{
    position:absolute;left:0;bottom:0;width:60vw;
    opacity:0;transform:translateY(34px) skewY(1.5deg);
    transition:opacity .9s cubic-bezier(.2,.9,.2,1),transform .9s cubic-bezier(.2,.9,.2,1);
  }
  .act.on{opacity:1;transform:none}
  .act .a-idx{
    font-size:10px;letter-spacing:.5em;color:var(--blood);
    text-transform:uppercase;margin-bottom:10px;
  }
  /* Outlined type over a bright red engine was illegible · a 1.5px bone stroke
     on transparent fill has nothing to separate it from whatever is behind it.
     Keep the outline (it is the look) and put a dark spread underneath it so the
     glyphs carve their own contrast wherever the camera happens to be. */
  .act h1{
    font-family:'Anton',sans-serif;
    font-size:clamp(40px,6.2vw,92px);
    line-height:.95;letter-spacing:.02em;
    color:transparent;
    -webkit-text-stroke:1.5px var(--bone);
    text-transform:uppercase;
    filter:drop-shadow(0 0 14px rgba(7,4,7,.95)) drop-shadow(0 2px 3px rgba(7,4,7,.85));
  }
  .act h1 em{
    font-style:normal;color:var(--blood);
    -webkit-text-stroke:.5px rgba(255,90,90,.55);
  }
  .act .a-line{
    margin-top:14px;font-size:11.5px;font-weight:400;
    letter-spacing:.13em;color:#a99ba0;max-width:480px;line-height:1.9;
    text-shadow:0 1px 6px rgba(7,4,7,.98),0 0 2px rgba(7,4,7,.9);
  }
  .act .a-idx{text-shadow:0 1px 6px rgba(7,4,7,.95)}

  /* ---------- vertical kanji column ---------- */
  #vcol{
    position:fixed;right:46px;top:50%;transform:translateY(-50%);
    z-index:40;pointer-events:none;height:60vh;
  }
  .vphrase{
    position:absolute;right:0;top:0;height:100%;
    writing-mode:vertical-rl;
    font-family:'Noto Serif JP',serif;font-weight:900;
    font-size:clamp(18px,2.4vw,30px);letter-spacing:.35em;
    color:var(--bone);opacity:0;
    transition:opacity 1.2s ease;
    text-shadow:0 0 30px rgba(211,26,43,.5);
  }
  .vphrase.on{opacity:.85}

  /* ---------- HUD ---------- */
  .hud{position:fixed;z-index:50;pointer-events:none;user-select:none}
  #hud-sigil{top:32px;left:40px;display:flex;align-items:center;gap:16px}
  #hud-sigil .glyph{
    font-family:'Noto Serif JP',serif;font-weight:900;
    font-size:42px;color:var(--blood);line-height:1;
    text-shadow:0 0 24px rgba(211,26,43,.6);
  }
  #hud-sigil .name{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.4em;color:var(--bone)}
  #hud-sigil .sub{font-size:8.5px;letter-spacing:.34em;color:var(--ash);margin-top:5px;text-transform:uppercase}
  #hud-state{top:38px;right:44px;text-align:right;font-size:9px;letter-spacing:.34em;
    color:var(--ash);text-transform:uppercase;line-height:2.2}
  #hud-state .blade-ok{color:var(--blood)}
  #mute{pointer-events:auto;cursor:pointer;color:var(--bone);text-decoration:none;border-bottom:1px solid rgba(240,232,220,.3)}
  #readout{bottom:34px;left:40px;font-size:9px;letter-spacing:.28em;
    color:var(--ash);text-transform:uppercase;line-height:2.1}
  #readout b{color:var(--blood);font-weight:400}
  #hint{bottom:34px;right:44px;text-align:right;font-size:9px;letter-spacing:.3em;
    color:var(--ash);text-transform:uppercase;line-height:2.2;transition:opacity 2s}

  /* ---------- the saya rail (act selector) ---------- */
  #rail{
    position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
    z-index:50;display:flex;align-items:center;gap:0;
  }
  #rail .r-line{width:52px;height:1px;background:linear-gradient(90deg,transparent,rgba(211,26,43,.55))}
  #rail .r-line.end{background:linear-gradient(90deg,rgba(211,26,43,.55),transparent)}
  /* Was a <div tabindex="-1">. The act selector is the only direct navigation
     in the piece and it could not be reached by keyboard at all. */
  .r-notch{
    -webkit-appearance:none;appearance:none;background:none;padding:0;
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif JP',serif;font-weight:900;font-size:15px;
    color:var(--ash);cursor:pointer;pointer-events:auto;
    border:1px solid transparent;transform:rotate(45deg);
    transition:all .45s;margin:0 7px;
  }
  .r-notch span{transform:rotate(-45deg)}
  .r-notch:hover{color:var(--bone);border-color:rgba(211,26,43,.5)}
  .r-notch:focus-visible{
    outline:none;color:var(--bone);border-color:var(--ember);
    box-shadow:0 0 0 3px rgba(255,59,48,.30),0 0 18px rgba(255,59,48,.5);
  }
  #mute{
    -webkit-appearance:none;appearance:none;background:none;padding:0;
    font:inherit;letter-spacing:inherit;
  }
  #mute:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
  .r-notch.active{
    color:var(--bone);border-color:var(--blood);
    box-shadow:0 0 18px rgba(211,26,43,.55);
    background:rgba(211,26,43,.12);
  }

  /* .active is declared after :focus-visible at equal specificity (0,2,0), so it
     erased the focus ring on exactly the notch a keyboard user lands on. Restate. */
  .r-notch:focus-visible{
    outline:none;color:var(--bone);border-color:var(--ember);
    box-shadow:0 0 0 3px rgba(255,59,48,.30),0 0 18px rgba(255,59,48,.5);
  }

  /* ---------- bullet time glyph ---------- */
  #tokiglyph{
    position:fixed;inset:0;z-index:46;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;
    opacity:0;transition:opacity .5s;
  }
  #tokiglyph.on{opacity:1}
  #tokiglyph .k{
    font-family:'Noto Serif JP',serif;font-weight:900;font-size:120px;
    color:var(--blood);opacity:.5;text-shadow:0 0 60px rgba(211,26,43,.8);
  }
  #tokiglyph .t{font-size:9px;letter-spacing:.6em;color:var(--ash);text-transform:uppercase;margin-top:10px}

  /* ---------- splash: the world arrives pre-cut ---------- */
  #splash{position:fixed;inset:0;z-index:80;pointer-events:none}
  #splash .half{
    position:absolute;left:0;width:100%;height:50.2%;
    background:var(--ink);overflow:hidden;
    display:flex;justify-content:center;
    transition:transform 1.4s cubic-bezier(.7,0,.2,1),opacity 1.2s;
  }
  #splash .top{top:0;align-items:flex-end}
  #splash .bot{bottom:0;align-items:flex-start}
  #splash .half .k{
    font-family:'Noto Serif JP',serif;font-weight:900;
    font-size:42vh;line-height:1;color:var(--blood);
    text-shadow:0 0 80px rgba(211,26,43,.5);
  }
  #splash .top .k{transform:translateY(50%)}
  #splash .bot .k{transform:translateY(-50%)}
  #splash .seam{
    position:absolute;top:50%;left:0;width:100%;height:1px;
    background:var(--ember);box-shadow:0 0 24px 2px rgba(255,59,48,.9);
    transition:opacity 1s;
  }
  #splash .word{
    position:absolute;bottom:12%;width:100%;text-align:center;
    font-size:10px;letter-spacing:.7em;text-indent:.7em;color:var(--ash);
    text-transform:uppercase;animation:pulse 3s ease-in-out infinite;
  }
  #splash.cut .top{transform:translateX(-6%) translateY(-101%)}
  #splash.cut .bot{transform:translateX(6%) translateY(101%)}
  #splash.cut .seam{opacity:0}
  /* `animation:pulse` on .word animates opacity, and a running animation wins
     over a plain declaration in the cascade · so this `opacity:0` never applied
     and "SCROLL TO TURN THE ENGINE" kept pulsing over the artwork forever.
     Cancel the animation and the rule can finally take effect. */
  #splash.cut .word{opacity:0;animation:none}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.95}}

  #fallback{position:fixed;inset:0;display:none;z-index:100;align-items:center;justify-content:center;
    background:var(--ink);color:var(--ash);font-size:11px;letter-spacing:.3em;
    text-transform:uppercase;text-align:center;line-height:2.4;padding:40px}

  /* The JS honours reduce-motion (drift, shake, petals) but the CSS did not:
     the splash still slid open, the acts still skewed in, and #splash .word ran
     an infinite opacity animation for as long as the tab stayed open. */
  @media (prefers-reduced-motion:reduce){
    #splash .word{animation:none;opacity:.6}
    #splash .half,#splash .seam,.act,.vphrase,#megakanji span,
    #tokiglyph,#hint,.r-notch{transition-duration:.01ms}
  }

  @media (max-width:760px){
    #acts{left:20px;bottom:120px}
    .act h1{font-size:38px}
    .act .a-line{max-width:74vw;font-size:10px}
    #vcol{display:none}
    #hud-state{display:none}
    #readout{left:20px}
    #hint{display:none}
    .r-notch{width:32px;height:32px;font-size:12px;margin:0 4px}
  }
</style>
</head>
<body>

<canvas id="scene" aria-label="A clockwork pagoda turning inside a ring of gates. Scroll to turn the engine, stroke quickly to cut the image, hold still to slow time."></canvas>
<canvas id="blade"></canvas>

<div id="megakanji"></div>

<div id="acts"></div>
<div id="vcol"></div>

<div class="hud" id="hud-sigil">
  <div class="glyph">斬</div>
  <div>
    <div class="name">ZAN</div>
    <div class="sub">The Heaven-Cutting Engine · MMMXXV</div>
  </div>
</div>
<div class="hud" id="hud-state">
  <span id="cycle">CYCLE 001</span><br>
  <span id="bladestate" class="blade-ok">BLADE DRAWN</span><br>
  <button id="mute" type="button" aria-pressed="false">音 SOUND ON</button>
</div>
<div class="hud" id="readout">
  <span id="ro-act"><b>ACT I</b> · TEN THOUSAND GATES</span><br>
  <span id="ro-data">ROT 0° · TIME 1.00× · CUTS 0</span>
</div>
<div class="hud" id="hint">
  scroll · turn the engine<br>
  a fast stroke · draw the blade<br>
  hold still · time kneels
</div>

<nav id="rail" aria-label="Acts">
  <div class="r-line" aria-hidden="true"></div>
  <div id="notches" style="display:flex"></div>
  <div class="r-line end" aria-hidden="true"></div>
</nav>

<div id="tokiglyph"><div class="k">刻</div><div class="t">time kneels</div></div>

<div id="splash">
  <div class="half top"><div class="k">斬</div></div>
  <div class="half bot"><div class="k">斬</div></div>
  <div class="seam"></div>
  <div class="word">scroll to turn the engine</div>
</div>

<div id="fallback">The engine requires WebGL.<br>Return with a sharper blade.</div>

<script src="vendor/three.r128.min.js"></script>
<script>
(function(){
  'use strict';

  /* ================================================================
     斬 ZAN · a perpetual mechanism, not a website.
     One closed camera loop. Five acts. No pages, no end.
     The cursor is a blade. The render itself can be cut.
     ================================================================ */

  var W=window.innerWidth, H=window.innerHeight;
  var canvas=document.getElementById('scene');
  var renderer;
  try{
    renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
  }catch(e){
    document.getElementById('fallback').style.display='flex';
    return;
  }
  var PR=Math.min(window.devicePixelRatio,2);
  renderer.setPixelRatio(PR);
  renderer.setSize(W,H);

  /* Absolute pixel ceiling for the offscreen scene pass: 2560x1440 = 3,686,400.
     The post pass always writes the default framebuffer at full native size, so
     the DOM HUD, the blade canvas and the screen-space grain stay native. Only
     the 3D pass is capped, and the governor scales inside the cap. */
  var MAXPIX=3686400;
  var Q={scale:1.0,auto:true};
  var rtW=2,rtH=2;
  function rtDims(){
    var nw=Math.max(2,Math.round(W*PR)), nh=Math.max(2,Math.round(H*PR));
    var k=Math.min(1,Math.sqrt(MAXPIX/(nw*nh)))*Q.scale;
    rtW=Math.max(2,Math.round(nw*k));
    rtH=Math.max(2,Math.round(nh*k));
  }
  function applyRT(){
    rtDims();
    if(rt)rt.setSize(rtW,rtH);
    if(postMat)postMat.uniforms.uTexel.value.set(1/rtW,1/rtH);
  }
  rtDims();
  renderer.setClearColor(0x070407,1);
  /* No outputEncoding here on purpose: the scene renders into a LinearEncoding
     render target and the only draw to the default framebuffer is the post
     ShaderMaterial below, which writes gl_FragColor without
     #include <encodings_fragment>. Setting it converted nothing. */

  var scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x070407,0.0062);

  var camera=new THREE.PerspectiveCamera(58,W/H,0.1,600);
  scene.add(camera);

  var PI=Math.PI;
  function clamp(x,a,b){return x<a?a:(x>b?b:x);}
  function v3(x,y,z){return new THREE.Vector3(x,y,z);}

  /* Reduce-motion here means "nothing moves unless you moved it". The engine
     still turns when you scroll, the blade still cuts when you strike, the acts
     still change · what stops is everything the page was doing *at* you:
     the unrequested camera drift, the handheld shake on impact, and the
     perpetual petal-fall. A vestibular trigger is motion you did not ask for. */
  var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- light ---------------- */
  scene.add(new THREE.AmbientLight(0x1c0e14,1.4));
  var coreLight=new THREE.PointLight(0xff2233,2.2,160,2);
  coreLight.position.set(0,16,0);
  scene.add(coreLight);
  var sunLight=new THREE.DirectionalLight(0xff4444,0.55);
  sunLight.position.set(0,30,-100);
  scene.add(sunLight);
  var lantern=new THREE.PointLight(0xf0e8dc,0.5,60,2);
  camera.add(lantern);

  /* ---------------- textures (generated, no assets) ---------------- */
  function radialTex(stops){
    var c=document.createElement('canvas');c.width=c.height=128;
    var x=c.getContext('2d');
    var g=x.createRadialGradient(64,64,0,64,64,64);
    stops.forEach(function(s){g.addColorStop(s[0],s[1]);});
    x.fillStyle=g;x.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  var glowTex=radialTex([[0,'rgba(255,60,60,0.9)'],[0.3,'rgba(211,26,43,0.35)'],[1,'rgba(211,26,43,0)']]);

  /* ================================================================
     THE ENGINE · a clockwork pagoda that contains itself.
     ================================================================ */
  var animators=[];
  var blackMetal=new THREE.MeshStandardMaterial({color:0x14101a,metalness:0.85,roughness:0.35});
  var redLacquer=new THREE.MeshStandardMaterial({color:0x8a1220,metalness:0.55,roughness:0.4,emissive:0x2a040a,emissiveIntensity:1});

  function xform(px,py,pz,rx,rz){
    var o=new THREE.Object3D();
    o.position.set(px,py,pz);o.rotation.set(rx,0,rz);o.updateMatrix();
    return o.matrix.clone();
  }
  /* Manual vertex concatenation. BufferGeometryUtils is not in the r128 build. */
  function mergeGeos(parts){
    var pos=[],nor=[],uvs=[],i,j,a,g,ng;
    for(i=0;i<parts.length;i++){
      g=parts[i].geo.clone();
      g.applyMatrix4(parts[i].m);
      ng=g.index?g.toNonIndexed():g;
      a=ng.attributes.position.array;for(j=0;j<a.length;j++)pos.push(a[j]);
      a=ng.attributes.normal.array;  for(j=0;j<a.length;j++)nor.push(a[j]);
      a=ng.attributes.uv.array;      for(j=0;j<a.length;j++)uvs.push(a[j]);
    }
    var out=new THREE.BufferGeometry();
    out.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
    out.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nor),3));
    out.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uvs),2));
    return out;
  }
  /* r128 vertex colours are vec3, so per-vertex opacity needs its own attribute.
     Patching LineBasicMaterial instead of writing a ShaderMaterial keeps fog
     (scene fog density is animated) and outputEncoding handling intact. */
  var lineVCMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true});
  lineVCMat.onBeforeCompile=function(sh){
    sh.vertexShader='attribute float lalpha;\nvarying float vLalpha;\n'+
      sh.vertexShader.replace('void main() {','void main() {\n\tvLalpha=lalpha;');
    sh.fragmentShader='varying float vLalpha;\n'+
      sh.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\n\tdiffuseColor.a *= vLalpha;');
  };
  function edgeSet(geo,color,opacity,dy){
    var e=new THREE.EdgesGeometry(geo);
    var p=e.attributes.position.array,n=p.length/3,i;
    var c=new Float32Array(n*3),al=new Float32Array(n),col=new THREE.Color(color);
    for(i=0;i<n;i++){c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;al[i]=opacity;}
    if(dy)for(i=0;i<n;i++)p[i*3+1]+=dy;
    e.setAttribute('color',new THREE.BufferAttribute(c,3));
    e.setAttribute('lalpha',new THREE.BufferAttribute(al,1));
    return e;
  }
  function mergeEdgeSets(list){
    var pos=[],col=[],alp=[],i,j,a;
    for(i=0;i<list.length;i++){
      a=list[i].attributes.position.array;for(j=0;j<a.length;j++)pos.push(a[j]);
      a=list[i].attributes.color.array;   for(j=0;j<a.length;j++)col.push(a[j]);
      a=list[i].attributes.lalpha.array;  for(j=0;j<a.length;j++)alp.push(a[j]);
    }
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
    g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));
    g.setAttribute('lalpha',new THREE.BufferAttribute(new Float32Array(alp),1));
    return new THREE.LineSegments(g,lineVCMat);
  }
  function edgeLines(geo,color,opacity){
    return new THREE.LineSegments(new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({color:color,transparent:true,opacity:opacity}));
  }

  function buildEngine(scale,depth){
    var g=new THREE.Group();
    var tiers=[];
    for(var k=0;k<7;k++){
      var tier=new THREE.Group();
      var r=16*(1-k/8.5);
      var slabGeo=new THREE.CylinderGeometry(r*0.82,r,1.3,6);
      var slab=new THREE.Mesh(slabGeo,blackMetal);
      tier.add(slab);
      var eaveGeo=new THREE.CylinderGeometry(r*1.05,r*1.45,0.4,6);
      var eave=new THREE.Mesh(eaveGeo,redLacquer);
      eave.position.y=1.0;
      tier.add(eave);
      tier.add(mergeEdgeSets([
        edgeSet(slabGeo,0xd31a2b,0.65,0),
        edgeSet(eaveGeo,0xff3b30,0.5,1.0)
      ]));
      tier.position.y=k*5.2;
      g.add(tier);
      tiers.push(tier);
    }
    // gear rings · they pass straight through the solid tiers. deliberately.
    var gears=[];
    for(var k=0;k<5;k++){
      var gr=new THREE.Group();
      var rad=20-(k*2.6);
      var torGeo=new THREE.TorusGeometry(rad,0.28,4,7+k);
      var tor=new THREE.Mesh(torGeo,blackMetal);
      gr.add(tor);
      gr.add(edgeLines(torGeo,0xd31a2b,0.8));
      var sp=[];
      for(var s=0;s<4;s++)
        sp.push({geo:new THREE.BoxGeometry(rad*2,0.16,0.16),m:xform(0,0,0,0,s*PI/4)});
      gr.add(new THREE.Mesh(mergeGeos(sp),redLacquer));
      gr.position.y=3+k*7;
      gr.rotation.x=PI/2;
      g.add(gr);
      gears.push(gr);
    }
    // one ring rotates in the wrong plane entirely
    var wrongGeo=new THREE.TorusGeometry(24,0.2,4,9);
    var wrong=new THREE.Group();
    wrong.add(new THREE.Mesh(wrongGeo,blackMetal));
    wrong.add(edgeLines(wrongGeo,0xff3b30,0.9));
    wrong.position.y=16;
    g.add(wrong);
    // the burning core

  function doSlash(a,b){
    lastSlash=performance.now();
    postMat.uniforms.uCutA.value.set(a.x/W,1-a.y/H);
    postMat.uniforms.uCutB.value.set(b.x/W,1-b.y/H);
    postMat.uniforms.uCutAmt.value=1;
    postMat.uniforms.uFlash.value=0.5;
    shake=1;
    cuts++;
    whoosh();
  }

  /* ---------------- blade trail (2D overlay) ---------------- */
  var bladeCv=document.getElementById('blade');
  var bctx=bladeCv.getContext('2d');
  function sizeBlade(){
    bladeCv.width=Math.max(1,Math.round(W*PR));
    bladeCv.height=Math.max(1,Math.round(H*PR));
    bctx.setTransform(PR,0,0,PR,0,0);
  }
  sizeBlade();
  /* Two string allocations per segment per frame (toFixed + concat). visTrail
     holds 340 ms of pointer samples, so a 120 Hz mouse means ~40 segments,
     ~80 strings a frame, ~4,800 a second while moving. Alpha peaks at 0.55, so
     1/100 quantisation is invisible. */
  var TRAIL_RGBA=[];
  for(var ti=0;ti<=100;ti++)TRAIL_RGBA[ti]='rgba(255,46,56,'+(ti/100)+')';
  function drawTrail(){
    bctx.setTransform(PR,0,0,PR,0,0);
    bctx.clearRect(0,0,W,H);
    if(visTrail.length<2)return;
    var now=performance.now();
    bctx.globalCompositeOperation='lighter';
    for(var i=1;i<visTrail.length;i++){
      var p0=visTrail[i-1],p1=visTrail[i];
      var age=(now-p1.t)/340;
      var al=(1-age)*0.55;
      if(al<=0)continue;
      bctx.strokeStyle=TRAIL_RGBA[(al*100)|0];
      bctx.lineWidth=(1-age)*2.4+0.4;
      bctx.beginPath();
      bctx.moveTo(p0.x,p0.y);
      bctx.lineTo(p1.x,p1.y);
      bctx.stroke();
    }
    bctx.globalCompositeOperation='source-over';
  }

  /* ---------------- camera ---------------- */
  var UP=new THREE.Vector3(0,1,0);
  /* getPointAt() and clone() each mint a Vector3. Four a frame, 240 a second at
     60 fps, all overwritten next frame. Curve.getPointAt takes an out param. */
  var _pos=new THREE.Vector3(),_tgt=new THREE.Vector3(),
      _dir=new THREE.Vector3(),_up=new THREE.Vector3();
  function updateCamera(){
    var pm=mod5(pCur);
    var t=pm/5;
    var pos=posCurve.getPointAt(t,_pos);
    var tgt=tgtCurve.getPointAt(t,_tgt);
    var dir=_dir.copy(tgt).sub(pos).normalize();
    var r=rollAt(pm);
    var up=_up.copy(UP);
    up.addScaledVector(dir,-up.dot(dir));
    if(up.lengthSq()<1e-4){up.set(1,0,0);up.addScaledVector(dir,-up.dot(dir));}
    up.normalize().applyAxisAngle(dir,r);
    camera.position.copy(pos);
    camera.up.copy(up);
    camera.lookAt(tgt);
    camera.rotateY(-mouseS.x*0.1);
    camera.rotateX(-mouseS.y*0.07);
    if(shake>0.001&&!REDUCED){
      camera.rotateZ((Math.random()-0.5)*0.05*shake);
      camera.rotateX((Math.random()-0.5)*0.022*shake);
      camera.rotateY((Math.random()-0.5)*0.022*shake);
    }
  }

  /* ---------------- HUD refs ---------------- */
  var splashEl=document.getElementById('splash');
  var hintEl=document.getElementById('hint');
  var cycleEl=document.getElementById('cycle');
  var bladeStateEl=document.getElementById('bladestate');
  var roAct=document.getElementById('ro-act');
  var roData=document.getElementById('ro-data');
  var tokiEl=document.getElementById('tokiglyph');
  var ROMAN5=['I','II','III','IV','V'];
  var actNames=['TEN THOUSAND GATES','THE ENGINE OF HEAVEN','THE CUT','THE INVERTED VOID','ETERNITY, AGAIN'];
  var curAct=-1;

  function setAct(i){
    if(i===curAct)return;
    curAct=i;
    ACTS.forEach(function(a,k){
      a.el.classList.toggle('on',k===i);
      a.vEl.classList.toggle('on',k===i);
      a.mEl.classList.toggle('on',k===i);
      a.nEl.classList.toggle('active',k===i);
      if(k===i)a.nEl.setAttribute('aria-current','true');else a.nEl.removeAttribute('aria-current');
    });
  }

  /* ---------------- frame-time governor ---------------- */
  /* Dead band 13.5..24.0 ms: anything between roughly 42 and 74 fps changes
     nothing. Descend fast (0.10, 500 ms lockout), climb slow (0.06, 900 ms).
     Worst case at the 0.50 floor an up-step multiplies scene pixels by
     (0.56/0.50)^2 = 1.25, so a frame that qualified to climb (<13.5 ms) lands
     at 16.9 ms at most, still 7.1 ms below the 24.0 ms down-trigger. A climb
     can never provoke the drop that would undo it. */
  var frameAvg=16.7, settle=1500;
  function governor(ms){
    if(ms>0&&ms<200)frameAvg+=(ms-frameAvg)*0.08;
    if(!Q.auto)return;
    settle-=ms;
    if(settle>0)return;
    if(frameAvg>24.0&&Q.scale>0.50){Q.scale=Math.max(0.50,Q.scale-0.10);applyRT();settle=500;}
    else if(frameAvg<13.5&&Q.scale<1.00){Q.scale=Math.min(1.00,Q.scale+0.06);applyRT();settle=900;}
  }

  /* ---------------- main loop ---------------- */
  var clock=new THREE.Clock();
  var worldTime=0,ts=1,frame=0,splashCut=false;

  function animate(){
    requestAnimationFrame(animate);
    var dt=Math.min(clock.getDelta(),0.05);
    var rt0=clock.elapsedTime;
    governor(dt*1000);

    // bullet time: held stillness makes the world kneel
    var still=holding&&(performance.now()-holdAt>180);
    var tsT=still?0.06:1;
    ts+=(tsT-ts)*Math.min(1,dt*4);
    worldTime+=dt*ts;
    tokiEl.classList.toggle('on',ts<0.5);
    postMat.uniforms.uSat.value=clamp((1-ts)*1.05,0,0.92);

    // travel (real time · you can move while time is stopped)
    var gap=Math.abs(pTarget-pCur);
    pCur+=(pTarget-pCur)*(1-Math.exp(-dt*(2.6+gap*2.2)));

    // cycle counter
    var wrapNow=Math.floor(pCur/5);
    if(wrapNow!==lastWrap){
      cycles+=Math.abs(wrapNow-lastWrap);
      lastWrap=wrapNow;
      cycleEl.textContent=cycles>=3?'CYCLE ∞':'CYCLE '+String(cycles+1).padStart(3,'0');
    }

    mouseS.x+=(mouse.x-mouseS.x)*0.05;
    mouseS.y+=(mouse.y-mouseS.y)*0.05;

    updateCamera();
    shake*=Math.exp(-dt*5.5);

    // decaying wounds
    postMat.uniforms.uCutAmt.value*=Math.exp(-dt*3.0);
    postMat.uniforms.uFlash.value*=Math.exp(-dt*9.0);
    postMat.uniforms.uTime.value=rt0;

    // world animation
    for(var i=0;i<animators.length;i++)animators[i](worldTime);

    // petals: gravity kneels near act IV
    var pm=mod5(pCur);
    var voidness=clamp(1-Math.abs(pm-3)/0.85,0,1);
    var gdir=1-2*voidness; // +1 falls, -1 rises
    for(var i=0;i<PCOUNT;i++){
      var pd=petalData[i];
      if(!REDUCED)pd.y-=dt*ts*pd.sp*gdir;
      if(pd.y<-16)pd.y+=64;
      if(pd.y>48)pd.y-=64;
      dummy.position.set(
        pd.x+Math.sin(worldTime*pd.sw+pd.ph)*3,
        pd.y,
        pd.z+Math.cos(worldTime*pd.sw*0.8+pd.ph)*2);
      dummy.rotation.set(worldTime*pd.rs,pd.ph+worldTime*pd.rs*0.7,pd.ph);
      dummy.updateMatrix();
      petals.setMatrixAt(i,dummy.matrix);
    }
    petals.instanceMatrix.needsUpdate=true;

    // fog breathes; thickens in the void
    scene.fog.density=0.0062+voidness*0.0028+Math.sin(rt0*0.2)*0.0004;

    drawTrail();

    // splash dissolves on first movement
    if(!splashCut&&userMoved){splashCut=true;splashEl.classList.add('cut');}
    hintEl.style.opacity=(pCur>0.6||cuts>0)?'0':'1';

    if((frame++%6)===0){
      var ai=Math.floor(pm+0.5)%5;
      setAct(ai);
      var ready=performance.now()-lastSlash>420;
      bladeStateEl.textContent=ready?'BLADE DRAWN':'BLADE SHEATHED';
      bladeStateEl.className=ready?'blade-ok':'';
      roAct.innerHTML='<b>ACT '+ROMAN5[ai]+'</b> · '+actNames[ai];
      roData.textContent='ROT '+Math.round(mod5(pCur)*72)+'° · TIME '+ts.toFixed(2)+'× · CUTS '+cuts;
    }

    renderer.setRenderTarget(rt);
    renderer.render(scene,camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene,postCam);
  }

  window.addEventListener('resize',function(){
    W=window.innerWidth;H=window.innerHeight;
    camera.aspect=W/H;
    camera.updateProjectionMatrix();
    renderer.setSize(W,H);
    applyRT();
    postMat.uniforms.uAspect.value=W/H;
    sizeBlade();
  });

  setAct(0);
  animate();
})();
</script>
</body>
</html>
